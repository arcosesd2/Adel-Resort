<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f9ff; }
    .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
    .card { background: #ffffff; border-radius: 16px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { color: #0c4a6e; font-size: 24px; margin: 0; }
    .header p { color: #64748b; font-size: 14px; margin-top: 4px; }
    .content { color: #334155; font-size: 16px; line-height: 1.6; }
    .content h2 { color: #0c4a6e; font-size: 20px; }
    .btn { display: inline-block; background: #0284c7; color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-weight: 600; font-size: 16px; margin: 20px 0; }
    .btn:hover { background: #0369a1; }
    .footer { text-align: center; margin-top: 30px; color: #94a3b8; font-size: 13px; }
    .info-row { padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
    .info-label { color: #64748b; font-size: 13px; }
    .info-value { color: #1e293b; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <h1>Adel Beach Resort</h1>
        <p>Your tropical getaway</p>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </div>
    <div class="footer">
      <p>&copy; {{ year|default:"2026" }} Adel Beach Resort. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
